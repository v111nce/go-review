name: go-review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Replace this with the real published module path and tag.
      # Recommended release builds set version metadata with:
      # -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
      - name: Install go-review
        run: go install github.com/v111nce/go-review/cmd/go-review@v0.1.0

      - name: Show go-review version
        run: go-review version

      - name: Run go-review CI profile
        run: go-review check --config go-review.yaml --profile ci --workdir .
