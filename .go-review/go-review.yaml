schema_version: "1.0"
tools:
  go_review: "generated"
  adapters:
    go.lint: "system-golangci-lint"
    go.test: "go"
    go.semantic: "builtin"
    # Optional adapters. Uncomment after installing the named tools.
    # go.vet: "go"                       # built in with Go; uncomment the adapter/step/profile entries below to enable.
    # staticcheck: "staticcheck"          # install: go install honnef.co/go/tools/cmd/staticcheck@latest
    # govulncheck: "govulncheck"          # install: go install golang.org/x/vuln/cmd/govulncheck@latest
    # gosec: "gosec"                      # install: go install github.com/securego/gosec/v2/cmd/gosec@latest
defaults:
  timeout: 30s
  workdir: ..
# Project-owned excludes. Add entries only when this repository intentionally ignores them.
exclude:
  - testdata
#   - generated
#   - third_party
artifacts:
  dir: ".go-review/artifacts/latest"
adapters:
  - id: go.lint.format
    type: go.lint
    args: [fmt, --no-config, --enable, gofmt, --enable, goimports]
    capabilities: [check, fix]
    timeout: 30s
    fix_safety: safe
  - id: go.lint.static
    type: go.lint
    args:
      - run
      - --config=.go-review/golangci.yml
      - --enable-only=errcheck,govet,staticcheck,unused,ineffassign,errorlint,errname,forcetypeassert,predeclared,bodyclose,gosec
      - --output.text.print-issued-lines=false
      - --show-stats=false
    capabilities: [check]
    timeout: 2m
    fix_safety: none
  - id: go.test
    type: cmd
    command: go
    args: [test, ./...]
    capabilities: [test]
    timeout: 2m
    parser: go-test
  - id: go.semantic
    type: go.semantic
    capabilities: [check]
    timeout: 30s
    fix_safety: review
  # Optional: go vet (no extra install; ships with Go).
  # - id: go.vet
  #   type: cmd
  #   command: go
  #   args: [vet, ./...]
  #   capabilities: [check]
  #   timeout: 2m
  #   parser: text
  # Optional: staticcheck. Install first:
  #   go install honnef.co/go/tools/cmd/staticcheck@latest
  # - id: staticcheck
  #   type: cmd
  #   command: staticcheck
  #   args: [./...]
  #   capabilities: [check]
  #   timeout: 2m
  #   parser: text
  # Optional: govulncheck. Install first:
  #   go install golang.org/x/vuln/cmd/govulncheck@latest
  # - id: govulncheck
  #   type: cmd
  #   command: govulncheck
  #   args: [./...]
  #   capabilities: [scan]
  #   timeout: 5m
  #   parser: text
  # Optional: gosec. Install first:
  #   go install github.com/securego/gosec/v2/cmd/gosec@latest
  # - id: gosec
  #   type: cmd
  #   command: gosec
  #   args: [./...]
  #   capabilities: [scan]
  #   timeout: 5m
  #   parser: text
steps:
  - id: format-check
    adapter: go.lint.format
    on_fail: continue
    allow_fix: true
  - id: lint
    adapter: go.lint.static
    on_fail: continue
  - id: test
    adapter: go.test
    on_fail: continue
  - id: semantic
    adapter: go.semantic
    on_fail: continue
  # Optional steps. Uncomment the matching adapter above before enabling.
  # Each step uses on_fail: continue so one review area does not prevent others from running.
  # - id: vet
  #   adapter: go.vet
  #   on_fail: continue
  # - id: staticcheck
  #   adapter: staticcheck
  #   on_fail: continue
  # - id: vulncheck
  #   adapter: govulncheck
  #   on_fail: continue
  # - id: security
  #   adapter: gosec
  #   on_fail: continue
profiles:
  - name: fast
    steps: [format-check, test]
  - name: ci
    steps: [format-check, lint, test, semantic]
  - name: nightly
    steps: [format-check, lint, test, semantic]
  # Optional after enabling the matching steps above:
  # - name: full
  #   steps: [format-check, test, semantic, vet, staticcheck, vulncheck, security]
