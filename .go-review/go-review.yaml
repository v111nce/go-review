schema_version: "1.0"
tools:
  go_review: "repo-local"
  adapters:
    go.format: "system-gofmt"
    go.test: "go"
    go.semantic: "builtin"
defaults:
  timeout: 30s
  workdir: ..
artifacts:
  dir: ".go-review/artifacts/latest"
adapters:
  - id: repo.format
    type: go.format
    args: [-l, cmd, internal, integration]
    capabilities: [check]
    timeout: 30s
    fix_safety: none
  - id: repo.test
    type: cmd
    command: go
    args: [test, ./...]
    capabilities: [test]
    timeout: 2m
    parser: go-test
  - id: repo.semantic-cmd
    type: go.semantic
    workdir: cmd
    capabilities: [check]
    timeout: 30s
    fix_safety: review
  - id: repo.semantic-internal
    type: go.semantic
    workdir: internal
    capabilities: [check]
    timeout: 30s
    fix_safety: review
  - id: repo.semantic-integration
    type: go.semantic
    workdir: integration
    capabilities: [check]
    timeout: 30s
    fix_safety: review
steps:
  - id: format-check
    adapter: repo.format
    on_fail: stop
    allow_fix: false
  - id: test
    adapter: repo.test
    depends_on: [format-check]
    on_fail: stop
  - id: semantic-cmd
    adapter: repo.semantic-cmd
    depends_on: [test]
    on_fail: stop
  - id: semantic-internal
    adapter: repo.semantic-internal
    depends_on: [test]
    on_fail: stop
  - id: semantic-integration
    adapter: repo.semantic-integration
    depends_on: [test]
    on_fail: stop
profiles:
  - name: fast
    steps: [format-check, test]
  - name: ci
    steps: [format-check, test, semantic-cmd, semantic-internal, semantic-integration]
  - name: nightly
    steps: [format-check, test, semantic-cmd, semantic-internal, semantic-integration]
